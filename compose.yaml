name: public-services

x-common: &common
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '3'

services:
  llama:
    <<: *common
    profiles: [llm]
    image: ghcr.io/ggml-org/llama.cpp@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
    user: '1000:1000'
    networks:
      - default
      - starharbor-model
    ports:
      - 127.0.0.1:18104:8080
    volumes:
      - ../data/llama/models:/models:ro
      - ../data/llama/secrets/api-key:/run/secrets/llama-api-key:ro
    command:
      - --model
      - /models/Qwen3.6-35B-A3B-UD-Q3_K_M.gguf
      - --alias
      - qwen3.6-35b-a3b-q3_k_m
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --n-gpu-layers
      - '0'
      - --threads
      - '2'
      - --threads-batch
      - '2'
      - --ctx-size
      - '16384'
      - --parallel
      - '1'
      # 单槽持续编码复用活动 KV；禁用额外 RAM 提示缓存，避免挤出模型权重。
      - --cache-ram
      - '0'
      - --batch-size
      - '256'
      - --ubatch-size
      - '128'
      - --no-repack
      - --jinja
      - --reasoning
      - 'off'
      - --api-key-file
      - /run/secrets/llama-api-key
      - --metrics
      - --no-slots
      - --poll
      - '0'
      - --timeout
      - '600'
      - --n-predict
      - '1024'
    cpus: '2.0'
    mem_limit: 18g
    memswap_limit: 18g
    pids_limit: 256
    oom_score_adj: 500
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', http://127.0.0.1:8080/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  it-tools:
    <<: *common
    image: lfdou/it-tools:${IT_TOOLS_REF:-local}
    build:
      context: ../source/it-tools
      labels:
        org.opencontainers.image.revision: ${IT_TOOLS_REF:-local}
    ports:
      - 127.0.0.1:18101:8080
    cpus: '0.35'
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3

  bentopdf:
    <<: *common
    image: lfdou/bentopdf:${BENTOPDF_REF:-local}
    build:
      context: ../source/bentopdf
      args:
        SIMPLE_MODE: 'true'
        DISABLE_GITHUB_STARS: 'true'
        SITE_URL: https://pdf.lfdou.ccwu.cc
        VITE_DEFAULT_LANGUAGE: zh
      labels:
        org.opencontainers.image.revision: ${BENTOPDF_REF:-local}
    ports:
      - 127.0.0.1:18102:8080
    entrypoint: [nginx, -g, 'daemon off;']
    cpus: '0.5'
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /etc/nginx/tmp:size=32m,uid=101,gid=101
      - /var/cache/nginx:size=64m,uid=101,gid=101
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3

  libretranslate:
    <<: *common
    image: lfdou/libretranslate:${LIBRETRANSLATE_REF:-local}
    build:
      context: ../source/libretranslate
      dockerfile: docker/Dockerfile
      labels:
        org.opencontainers.image.revision: ${LIBRETRANSLATE_REF:-local}
    ports:
      - 127.0.0.1:18103:5000
    environment:
      LT_HOST: 0.0.0.0
      LT_LOAD_ONLY: en,zh
      LT_UPDATE_MODELS: 'true'
      LT_THREADS: '1'
      LT_CHAR_LIMIT: '2000'
      LT_BATCH_LIMIT: '1'
      LT_REQ_LIMIT: '6'
      LT_HOURLY_REQ_LIMIT: '60'
      LT_DAILY_REQ_LIMIT: '200'
      LT_REQ_TIME_COST: '5'
      LT_TRUST_FORWARDED_FOR: 'true'
      LT_DISABLE_FILES_TRANSLATION: 'true'
      LT_FRONTEND_LANGUAGE: zh
      LT_FRONTEND_LANGUAGE_SOURCE: auto
      LT_FRONTEND_LANGUAGE_TARGET: en
      LT_FRONTEND_TITLE: LF 中英翻译
      LT_FRONTEND_TIMEOUT: '500'
      LT_API_KEYS_DB_PATH: /app/db/api_keys.db
      ARGOS_DEVICE_TYPE: cpu
      XDG_CONFIG_HOME: /home/libretranslate/.cache/config
    volumes:
      - ../data/libretranslate/models:/home/libretranslate/.local
      - ../data/libretranslate/cache:/home/libretranslate/.cache
      - ../data/libretranslate/db:/app/db
    cpus: '1.25'
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: [CMD, ./venv/bin/python, -c, "import requests; requests.get('http://127.0.0.1:5000/health', json={}, timeout=5).raise_for_status()"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s

networks:
  starharbor-model:
    external: true
    name: starharbor-model
